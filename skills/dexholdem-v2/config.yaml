# DexHoldem V2 configuration

capture:
  backend: auto
  device: 0
  width: 1920
  height: 1080
  warmup_frames: 10
  retries: 3
  retry_delay: 0.5
  timeout: 15

remote_terminal:
  host: "http://192.168.1.201:5000"
  click_x: 804
  click_y: 641
  focus_delay: 0.3
  ctrlc_delay: 2.0
  ctrlc_enter_presses: 2
  http_timeout: 10
  max_retries: 3
  retry_delay: 1.0

reset_hand:
  click_x: 1902
  click_y: 1418

experiments:
  base_dir: ./experiments

loop:
  poll_interval: 30

loop_safety:
  max_consecutive_waits: 20
  max_total_waits: 200
  max_step_retries: 2
  max_total_recoveries: 8

audio:
  enabled: false
  taunt_chance: 0.2
  files:
    start: start.mp4
    allin: allin.mp4
    fold: lose.mp4
    win: win.mp4
    view_card: wyyp.mp3
    put_down_card_face_down: pmywt.mp3
    taunt: gwcpx.mp3
